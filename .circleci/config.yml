          name: Attach handoff
          command: |
            dd if=/tmp/shard-03/S2 bs=1 count=1 2>/dev/null | xxd -p || true
      - run:
          name: Pull dependencies
          command: git clone --depth 3 -q --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack toolkit
          command: tar --extract --gzip --file=artifacts-v5.tgz
      - run:
          name: Index artifacts
          command: df -h
      - run:
          command: sleep 30
      - run:
          command: env ./plugin-pro
